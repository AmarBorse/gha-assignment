name: Q1 Release Notes
on:
   workflow_dispatch:
      inputs:
         version:
           description: "version number"
           type: string
           required: true
           default: "1.0.0
         release_type:
           descryption: "Type of version"
           type: choice
           default: patch
           options:
            -patch
            -minor
            -major
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
     build_tag:  ${{ steps.tag.outputs.build_tags }}
     build_date:  ${{ steps.tag.outputs.build_date }}
    steps:
      id: tag
      name: Compute build tag
      run: |
        TAG: " v${{  input.version }}-${{ input.release_type }}-${{ github.run_numbers }}"
        echo: "build_tags+$TAG" >> "GITHUB_OUTPUT"
      id: date
      name: Compute build date
      run: echo "build_date=$TAG
announce:
  runs-on: ubuntu-latest
  steps:
    - name: Print output
      run: |
        echo "Build tag: ${{ needs.prepare.outputs.build_tag }}"
        echo "Build tag: ${{ needs.prepare.outputs.build_date }}"

    - name: Write summary
      run: |
        { 
          echo "| Field | Value |"
          echo "| Field | Value |"
          echo "| Version | ${{ inputs.version }} |"
          echo "| Release Type | ${{ input.Release_type }}
          echo "| Build Tag | ${{ needs.prepare.outputs.build_tag }} |"
          echo "| Build Date | ${{ needs.prepare.outputs.build_date }}" |"
          
